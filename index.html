120deg,#ffcc70,#e5a650);border-color:#e7b666;color:#202533}.button.green{background:#176d5c;border-color:#2caa88}.button.warn{background:#573c44;border-color:#a05a65}.button.ghost{background:transparent;border-color:#466078}.button.small{padding:6px 10px;min-height:36px;font-size:12px}.side{display:flex;flex-direction:column;gap:12px}.section{padding:14px}.section h2{font-size:15px;margin:0 0 9px}.instruction{border-radius:12px;padding:11px;background:#23394c;border:1px solid #47627a;font-size:14px;font-weight:750}.instruction .step{color:var(--gold);margin-right:6px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.metric{background:#0b2236;border-radius:10px;padding:9px 6px;text-align:center}.metric strong{display:block;font-size:17px;color:var(--gold)}.metric span{font-size:10px;color:var(--muted)}.plantlist,.buildinglist{display:flex;flex-direction:column;gap:7px}.plantrow,.buildingrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:11px;background:#0c2337;padding:9px 10px;border:1px solid #35536b}.plantrow.active{border-color:var(--gold)}.plantrow strong,.buildingrow strong{font-size:13px}.sub{color:var(--muted);font-size:11px}.sub.green{color:var(--green)}.sub.gold{color:var(--gold)}.rowleft{min-width:0}.rowright{text-align:right;flex-shrink:0}.tag{font-size:10px;border-radius:5px;padding:2px 5px;background:#324b61;color:#c4d5e2}.tag.req{background:#5a443c;color:#ffd7b5}.tag.opt{background:#26493e;color:#aaf1cf}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions>*{flex:1}.message{margin-top:9px;font-size:12px;color:var(--muted);min-height:20px}.message.good{color:var(--green)}.message.bad{color:var(--red)}.workshop{max-width:850px;margin:auto}.shopgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.shopcard{padding:15px;border:1px solid #3b5970;background:#10263b;border-radius:15px;display:flex;flex-direction:column;gap:8px}.shopcard h3{margin:0;font-size:15px}.shopcard p{font-size:12px;color:var(--muted);margin:0;flex:1}.shopcard .level{font-size:11px;color:var(--gold)}.shopcard button{width:100%}.summary{padding:20px;text-align:center}.summary .big{font-size:52px;line-height:1.2}.summary h2{font-size:23px;margin:8px 0}.summary p{color:var(--muted);margin:8px auto;max-width:600px}.summary .earn{font-size:28px;font-weight:900;color:var(--gold)}.city{display:flex;align-items:end;justify-content:center;gap:4px;height:85px;margin:14px 0 8px;border-bottom:2px solid #45627c}.tower{width:14%;background:#1d3347;border:1px solid #45617a;border-bottom:0;border-radius:4px 4px 0 0;position:relative}.tower.lit{background:linear-gradient(160deg,#325b65,#194b55);border-color:#d1a85b}.tower:after{content:'▦';position:absolute;inset:0;text-align:center;font-size:22px;color:#435b6e}.tower.lit:after{color:var(--gold)}.overlay{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:15px}.modal{max-width:470px;width:100%;padding:22px;background:#183148;border:1px solid #5c819a;border-radius:18px;box-shadow:0 24px 80px #0008}.modal h2{margin:0 0 10px}.modal p,.modal li{color:#c4d8e5;font-size:14px}.modal ol{padding-left:20px}.footer{text-align:center;color:#7f9aaf;font-size:11px;margin-top:20px}.notice{color:#a7d9ee;font-size:12px;margin:6px 0 0}.screenreader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

</style></head><body><div id="app" class="wrap"></div><script>
(()=>{'use strict';
const W=7,H=6;
const LEVELS=[
{id:'l1',title:'01｜最初の灯り',desc:'まずは2軒に電気を届けよう。発電所をタップして、建物をタップするだけ。',base:550,plants:[{id:'a',x:1,y:3,name:'中央発電所',cap:5}],buildings:[{id:'h1',x:3,y:1,name:'住宅A',icon:'🏠',load:2,req:1,bonus:120},{id:'h2',x:5,y:4,name:'住宅B',icon:'🏠',load:2,req:1,bonus:120}],blocks:[],newFeature:'基本操作：発電所 → 建物の順にタップで自動配線'},
{id:'l2',title:'02｜商店街の夜',desc:'必須施設を復旧すると作業完了。余裕があれば商店も復旧して追加報酬を狙おう。',base:700,plants:[{id:'a',x:1,y:3,name:'中央発電所',cap:6}],buildings:[{id:'h1',x:3,y:1,name:'住宅街',icon:'🏘️',load:2,req:1,bonus:130},{id:'w1',x:4,y:4,name:'給水所',icon:'🚰',load:3,req:1,bonus:170},{id:'s1',x:6,y:2,name:'商店',icon:'🏪',load:2,req:0,bonus:300}],blocks:[],newFeature:'追加報酬：任意施設も復旧すると報酬が増える'},
{id:'l3',title:'03｜二つの発電所',desc:'発電所が2つに。電力の残量と電線の長さを比べて、どちらから送るか決めよう。',base:850,plants:[{id:'a',x:1,y:1,name:'北発電所',cap:5},{id:'b',x:5,y:4,name:'南発電所',cap:5}],buildings:[{id:'h1',x:3,y:0,name:'病院',icon:'🏥',load:4,req:1,bonus:200},{id:'h2',x:3,y:4,name:'住宅街',icon:'🏠',load:3,req:1,bonus:140},{id:'h3',x:6,y:1,name:'通信所',icon:'📡',load:2,req:1,bonus:160},{id:'o1',x:0,y:5,name:'公園',icon:'🌳',load:2,req:0,bonus:240}],blocks:[],newFeature:'電力の配分：どちらの発電所につなぐかが重要'},
{id:'l4',title:'04｜土砂崩れの地区',desc:'通れない場所は自動で迂回。電線の距離が長いほど費用がかかる。',base:1000,plants:[{id:'a',x:0,y:2,name:'西発電所',cap:6},{id:'b',x:6,y:3,name:'東発電所',cap:6}],buildings:[{id:'h1',x:2,y:0,name:'避難所',icon:'🏫',load:3,req:1,bonus:200},{id:'h2',x:4,y:0,name:'病院',icon:'🏥',load:4,req:1,bonus:220},{id:'h3',x:3,y:5,name:'給水所',icon:'🚰',load:3,req:1,bonus:200},{id:'o1',x:6,y:0,name:'商店',icon:'🏪',load:2,req:0,bonus:300}],blocks:[[3,1],[3,2],[3,3]],newFeature:'通行止め：遠回りの電線は高い。配線効率の強化が役立つ'},
{id:'l5',title:'05｜工業地帯',desc:'工場は大量の電力を消費する。設備を強化していれば、さらに多くの施設を救える。',base:1200,plants:[{id:'a',x:1,y:1,name:'北発電所',cap:7},{id:'b',x:5,y:4,name:'南発電所',cap:7}],buildings:[{id:'h1',x:4,y:1,name:'工場',icon:'🏭',load:5,req:1,bonus:240},{id:'h2',x:1,y:4,name:'病院',icon:'🏥',load:4,req:1,bonus:220},{id:'h3',x:6,y:1,name:'避難所',icon:'🏫',load:3,req:1,bonus:180},{id:'o1',x:3,y:5,name:'市場',icon:'🏬',load:3,req:0,bonus:350}],blocks:[[3,2],[3,3]],newFeature:'大型施設：電力強化や蓄電池の価値が高まる'},
{id:'l6',title:'06｜最後の大停電',desc:'街の最後の地区。どの施設を、どの電源から復旧するか。育てた設備で挑もう。',base:1550,plants:[{id:'a',x:0,y:1,name:'北西発電所',cap:7},{id:'b',x:6,y:1,name:'北東発電所',cap:6},{id:'c',x:3,y:5,name:'南発電所',cap:5}],buildings:[{id:'h1',x:2,y:0,name:'総合病院',icon:'🏥',load:4,req:1,bonus:260},{id:'h2',x:4,y:0,name:'大工場',icon:'🏭',load:5,req:1,bonus:300},{id:'h3',x:1,y:4,name:'避難所',icon:'🏫',load:3,req:1,bonus:220},{id:'h4',x:5,y:4,name:'給水所',icon:'🚰',load:3,req:1,bonus:220},{id:'o1',x:0,y:5,name:'市場',icon:'🏬',load:3,req:0,bonus:400},{id:'o2',x:6,y:5,name:'街灯',icon:'💡',load:2,req:0,bonus:280}],blocks:[[3,1],[3,2],[3,3]],newFeature:'最終試験：全ての知識と設備を使って街を復旧しよう'}
];
const upgrades=[{id:'power',name:'⚡ 発電機を強化',desc:'全発電所の供給上限が +2。余分な施設も復旧しやすくなる。',max:3,prices:[650,1050,1450]},{id:'wire',name:'🧵 高効率ケーブル',desc:'配線1マスの費用が 22 → 16 → 11 に減る。長い配線ほど節約。',max:2,prices:[550,900]},{id:'battery',name:'🔋 蓄電池',desc:'全地区で最初の発電所の供給上限が +3。3地区目から購入可能。',max:1,prices:[950]}];
let state={screen:'play',stage:0,cash:650,up:{power:0,wire:0,battery:0},selected:null,links:{},subsidy:false,subsidies:0,cleared:0,earnings:0,spent:0,modal:null,message:'まず青い発電所をタップしよう。',messageKind:'',lastReward:0,lastBreakdown:null};
const app=document.getElementById('app');
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const level=()=>LEVELS[state.stage];
const getPlant=id=>level().plants.find(p=>p.id===id);
const getBuilding=id=>level().buildings.find(b=>b.id===id);
const capacity=p=>p.cap+2*state.up.power+(state.up.battery&&p.id===level().plants[0].id?3:0);
const used=id=>Object.entries(state.links).reduce((n,[bid,link])=>n+(link.plant===id?getBuilding(bid).load:0),0);
const wirePrice=()=>[22,16,11][state.up.wire];
const k=(x,y)=>x+','+y;
const isBlock=(x,y)=>level().blocks.some(a=>a[0]===x&&a[1]===y);
function pathFind(from,to){const occupied=new Set([...level().plants,...level().buildings].filter(n=>n.id!==from.id&&n.id!==to.id).map(n=>k(n.x,n.y)));const queue=[[[from.x,from.y]]],visited=new Set([k(from.x,from.y)]);while(queue.length){const path=queue.shift(),[x,y]=path[path.length-1];if(x===to.x&&y===to.y)return path;for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){const nx=x+dx,ny=y+dy,kk=k(nx,ny);if(nx<0||ny<0||nx>=W||ny>=H||visited.has(kk)||isBlock(nx,ny)||occupied.has(kk))continue;visited.add(kk);queue.push([...path,[nx,ny]])}}return null}
function calcCost(path){return (path.length-1)*wirePrice()}
function msg(t,kind=''){state.message=t;state.messageKind=kind;const el=document.getElementById('message');if(el){el.textContent=t;el.className='message '+kind}}
function tapPlant(id){if(state.screen!=='play')return;state.selected=state.selected===id?null:id;msg(state.selected?`「${getPlant(id).name}」を選択中。次に復旧したい建物をタップ。`:'選択を解除したよ。発電所を選んでね。');render()}
function tapBuilding(id){if(state.screen!=='play')return;const b=getBuilding(id);if(state.links[id]){state.modal={kind:'disconnect',id};render();return}if(!state.selected){msg(`先に青い発電所をタップしてから「${b.name}」をタップしてね。`,'bad');render();return}const p=getPlant(state.selected),path=pathFind(p,b);if(!path){msg('この発電所からの道がふさがっているよ。別の発電所を選んでみて。','bad');render();return}const cost=calcCost(path);if(used(p.id)+b.load>capacity(p)){msg(`${p.name}の電力が足りない（残り${capacity(p)-used(p.id)}、必要${b.load}）。別の発電所を選ぶか、撤去して配分を変更しよう。`,'bad');render();return}if(state.cash<cost){msg(`配線費用が足りない（必要${yen(cost)}）。配線の撤去・緊急支援を使ってね。`,'bad');render();return}state.cash-=cost;state.spent+=cost;state.links[id]={plant:p.id,path,cost};msg(`✨ ${b.name}が点灯！ 電線${path.length-1}マス／費用${yen(cost)}。`,'good');state.selected=null;render()}
function disconnect(id){const link=state.links[id];if(!link)return;state.cash+=link.cost;state.spent-=link.cost;delete state.links[id];state.modal=null;msg(`${getBuilding(id).name}の電線を撤去。${yen(link.cost)}を返金したよ。`);render()}
function resetLinks(){Object.values(state.links).forEach(link=>state.cash+=link.cost);state.spent=0;state.links={};state.selected=null;state.modal=null;msg('この地区の配線をやり直したよ。費用はすべて返金済み。');render()}
function support(){if(state.subsidy)return;state.cash+=450;state.subsidy=true;state.subsidies++;msg('緊急支援で¥450を受け取った。作業報酬から¥200が差し引かれるよ。','good');render()}
function finish(){const missing=level().buildings.filter(b=>b.req&&!state.links[b.id]);if(missing.length){msg(`必須施設があと${missing.length}か所！ ${missing.map(b=>b.name).join('・')}を復旧しよう。`,'bad');render();return}const optional=level().buildings.filter(b=>!b.req&&state.links[b.id]);const optionalBonus=optional.reduce((n,b)=>n+b.bonus,0);const reward=level().base+optionalBonus-(state.subsidy?200:0);state.cash+=reward;state.earnings+=reward;state.lastReward=reward;state.lastBreakdown={base:level().base,bonus:optionalBonus,penalty:state.subsidy?200:0,optional:optional.length,spend:state.spent};state.cleared++;state.selected=null;state.screen=state.stage===LEVELS.length-1?'ending':'result';state.modal=null;render()}
function next(){state.stage++;state.screen='shop';state.selected=null;state.links={};state.spent=0;state.subsidy=false;state.message='設備を強化しても、貯金して次の仕事へ進んでもOK。';render()}
function startStage(){state.screen='play';state.links={};state.spent=0;state.subsidy=false;state.selected=null;state.modal=null;state.message='青い発電所をタップ → 建物をタップで自動配線。';state.messageKind='';render()}
function buy(id){const u=upgrades.find(u=>u.id===id),rank=state.up[id];if(rank>=u.max||id==='battery'&&state.stage<2)return;const price=u.prices[rank];if(state.cash<price){msg('お金が足りないよ。次の仕事で稼ごう。','bad');render();return}state.cash-=price;state.up[id]++;msg(`${u.name}を購入！次の復旧から効果が出るよ。`,'good');render()}
function restart(){state={screen:'play',stage:0,cash:650,up:{power:0,wire:0,battery:0},selected:null,links:{},subsidy:false,subsidies:0,cleared:0,earnings:0,spent:0,modal:null,message:'まず青い発電所をタップしよう。',messageKind:'',lastReward:0,lastBreakdown:null};render()}
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function head(){return `<header><div class="brand">🌃 夜の復旧班 <small>v0.4 ｜ 街を取り戻す</small></div><div class="money" aria-label="所持金">🪙 ${yen(state.cash)}</div></header><div class="topline"><div class="progress" aria-label="復旧地区 ${state.cleared} / 6">${LEVELS.map((l,i)=>`<span class="dot ${i<state.cleared?'on':''}" title="地区${i+1}"></span>`).join('')} <span class="pill">${state.cleared} / 6 地区復旧</span></div><span class="pill">🔧 発電Lv${state.up.power}・電線Lv${state.up.wire}・蓄電池${state.up.battery?'あり':'なし'}</span></div>`}
function city(){return `<div class="city" aria-label="復旧した街の夜景">${[48,73,59,84,64,77].map((h,i)=>`<div class="tower ${i<state.cleared?'lit':''}" style="height:${h}px" title="地区${i+1}"></div>`).join('')}</div>`}
function board(){const l=level();let svg=`<svg viewBox="0 0 700 600" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="#40607b" stroke-width="2" stroke-opacity=".55" stroke-dasharray="4 7"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="700" height="600" fill="url(#grid)"/>`;
const colors=['#75c8ff','#ffcf70','#c8b0ff'];for(const [bid,link] of Object.entries(state.links)){const i=l.plants.findIndex(p=>p.id===link.plant),points=link.path.map(([x,y])=>`${x*100+50},${y*100+50}`).join(' ');svg+=`<polyline points="${points}" fill="none" stroke="${colors[i]}" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" opacity=".22" filter="url(#glow)"/><polyline points="${points}" fill="none" stroke="${colors[i]}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>`}
svg+='</svg>';let html=`<div class="map" id="map" role="group" aria-label="配線マップ">${svg}`;for(const [x,y] of l.blocks){html+=`<span class="obstacle" style="left:${(x+.5)/W*100}%;top:${(y+.5)/H*100}%" title="通行止め">🪨</span>`}for(const [i,p] of l.plants.entries()){html+=`<button class="node plant ${state.selected===p.id?'selected':''} ${used(p.id)?'busy':''}" style="left:${(p.x+.5)/W*100}%;top:${(p.y+.5)/H*100}%" data-action="plant" data-id="${p.id}" aria-label="${p.name}、電力${used(p.id)}/${capacity(p)}"><span class="powerdot">${capacity(p)-used(p.id)}⚡</span><span class="emoji">⚡</span><span class="nname">発電${i+1}</span></button>`}for(const b of l.buildings){html+=`<button class="node facility ${state.links[b.id]?'connected':''} ${b.req?'required':'optional'}" style="left:${(b.x+.5)/W*100}%;top:${(b.y+.5)/H*100}%" data-action="building" data-id="${b.id}" aria-label="${b.name}、必要電力${b.load}、${state.links[b.id]?'復旧済み、タップで撤去':'未復旧'}"><span class="powerdot">${b.load}⚡</span>${state.links[b.id]?'<span class="check">✓</span>':''}<span class="emoji">${b.icon}</span><span class="nname">${escapeHtml(b.name)}</span></button>`}return html+'</div>'}
function play(){const l=level(),done=l.buildings.filter(b=>b.req&&state.links[b.id]).length,required=l.buildings.filter(b=>b.req).length,optional=l.buildings.filter(b=>!b.req&&state.links[b.id]).reduce((s,b)=>s+b.bonus,0);return `<div class="hero panel"><h1>${l.title}</h1><p>${l.desc}</p><p class="notice">🆕 ${l.newFeature}</p></div><div class="layout"><div class="panel map-panel"><div class="maptop"><b>🗺️ 復旧マップ</b><span>⚡ 発電所　🏠 建物　🪨 通行止め</span></div>${board()}<div class="helpbar"><p>青い発電所を選ぶ → 建物を選ぶ。電線は自動でつながるよ。点灯済みの建物をタップすると撤去できる。</p><button class="button ghost small" data-action="help">？ 操作方法</button></div></div><div class="side"><section class="panel section"><h2>👷 作業指示</h2><div class="instruction"><span class="step">${state.selected?'②':'①'}</span>${state.selected?`次に建物を選ぼう（${escapeHtml(getPlant(state.selected).name)}）`:'まず発電所をタップしよう'}</div><div class="metrics"><div class="metric"><strong>${done}/${required}</strong><span>必須施設</span></div><div class="metric"><strong>${wirePrice()}円</strong><span>電線1マス</span></div><div class="metric"><strong>${yen(l.base+optional)}</strong><span>予定報酬</span></div></div><div class="actions"><button class="button green" data-action="finish" ${done!==required?'disabled':''}>${done===required?'✓ 復旧完了・報酬受取':'必須施設を復旧しよう'}</button></div><div id="message" class="message ${state.messageKind}" role="status" aria-live="polite">${escapeHtml(state.message)}</div></section><section class="panel section"><h2>⚡ 発電所の電力</h2><div class="plantlist">${l.plants.map((p,i)=>`<div class="plantrow ${state.selected===p.id?'active':''}"><div class="rowleft"><strong>${i===0?'🔵':i===1?'🟡':'🟣'} ${escapeHtml(p.name)}</strong><div class="sub">使用 ${used(p.id)} / 上限 ${capacity(p)} ⚡</div></div><button class="button small ${state.selected===p.id?'primary':''}" data-action="plant" data-id="${p.id}">${state.selected===p.id?'選択中':'選ぶ'}</button></div>`).join('')}</div></section><section class="panel section"><h2>🏘️ 復旧する施設</h2><div class="buildinglist">${l.buildings.map(b=>`<div class="buildingrow"><div class="rowleft"><strong>${b.icon} ${escapeHtml(b.name)}</strong> <span class="tag ${b.req?'req':'opt'}">${b.req?'必須':'追加報酬'}</span><div class="sub">必要 ${b.load}⚡ ${!b.req?'・追加'+yen(b.bonus):''}</div></div><div class="rowright"><button class="button small ${state.links[b.id]?'green':''}" data-action="building" data-id="${b.id}">${state.links[b.id]?'✓ 撤去も可':'つなぐ'}</button></div></div>`).join('')}</div><div class="actions"><button class="button ghost small" data-action="reset">↩ この地区をやり直す</button><button class="button small" data-action="support" ${state.subsidy?'disabled':''}>🆘 支援+¥450</button></div><p class="sub">緊急支援は各地区1回。使用すると報酬から¥200減額。</p></section></div></div>`}
function result(){const b=state.lastBreakdown;return `<section class="panel summary workshop"><div class="big">🌟</div><h2>${LEVELS[state.stage].title} 復旧完了！</h2><p>電気が戻り、街に明かりが増えた。稼いだお金で設備を強化して、次の地区へ向かおう。</p>${city()}<div class="earn">+${yen(state.lastReward)}</div><p>基本報酬 ${yen(b.base)} ＋ 任意施設 ${yen(b.bonus)} ${b.penalty?'− 支援費 '+yen(b.penalty):''}</p><p>所持金：<strong style="color:var(--gold)">${yen(state.cash)}</strong>　｜　今回の配線費：${yen(b.spend)}</p><button class="button primary" data-action="next">🔧 工房へ進む・新しい設備をチェック</button></section>`}
function shop(){return `<div class="workshop"><section class="hero panel"><h1>🔧 復旧班の工房</h1><p>次は「${LEVELS[state.stage].title}」。お金を使って強化するか、貯めておくかは自由！</p><p class="notice">🆕 次の新要素：${LEVELS[state.stage].newFeature}</p></section><div class="shopgrid">${upgrades.map(u=>{const rank=state.up[u.id],locked=u.id==='battery'&&state.stage<2,full=rank>=u.max,price=u.prices[rank]||0;return `<div class="shopcard"><h3>${u.name}</h3><div class="level">強化 ${rank}/${u.max} ${locked?'｜3地区目から解放':''}</div><p>${u.desc}</p><button class="button ${!locked&&!full&&state.cash>=price?'primary':''}" data-action="buy" data-id="${u.id}" ${locked||full||state.cash<price?'disabled':''}>${locked?'🔒 未解放':full?'✓ 最大強化':`購入 ${yen(price)}`}</button></div>`}).join('')}</div><div class="panel section" style="margin-top:12px"><h2>📋 次の仕事</h2><p style="color:var(--muted);font-size:13px">${LEVELS[state.stage].desc}</p><div class="actions"><button class="button primary" data-action="start">▶ ${LEVELS[state.stage].title} へ出発</button></div><p class="sub">設備を買わなくてもクリア可能。電線を敷くお金が足りなくなったら、現場で緊急支援を受けられるよ。</p></div></div>`}
function ending(){return `<section class="panel summary workshop"><div class="big">🌅</div><h2>街に、朝が来た。</h2><p>全6地区の復旧完了！暗かった街に灯りが戻った。どんな設備を選んで、どこに電力を届けるか。その判断が復旧の形を作った。</p>${city()}<div class="earn">🎉 全地区クリア</div><p>最終所持金 <strong style="color:var(--gold)">${yen(state.cash)}</strong>　｜　獲得報酬合計 ${yen(state.earnings)}　｜　緊急支援 ${state.subsidies}回</p><p>発電機Lv${state.up.power}／電線Lv${state.up.wire}／蓄電池${state.up.battery?'導入済み':'未導入'}</p><p>これはゲームの成長・報酬ループを検証する短い試作版です。プレイ後、前より「次をやりたい」と感じたか教えてね。</p><button class="button primary" data-action="restart">↻ 最初から別の強化で遊ぶ</button></section>`}
function modal(){if(!state.modal)return '';if(state.modal.kind==='disconnect'){const b=getBuilding(state.modal.id),link=state.links[b.id];return `<div class="overlay" data-overlay="true"><div class="modal" role="dialog" aria-modal="true" aria-label="電線の撤去"><h2>🔌 ${escapeHtml(b.name)}</h2><p>現在「${escapeHtml(getPlant(link.plant).name)}」から送電中。電線を撤去すると電力が止まり、<strong>${yen(link.cost)}</strong>が返金されるよ。</p><div class="actions"><button class="button warn" data-action="disconnect" data-id="${b.id}">電線を撤去して返金</button><button class="button ghost" data-action="close">戻る</button></div></div></div>`}if(state.modal.kind==='reset'){return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><h2>↩ 配線をやり直す？</h2><p>この地区の電線だけを全て撤去して、費用を返金するよ。購入したアップグレードや過去のクリアはそのまま。</p><div class="actions"><button class="button warn" data-action="resetConfirm">配線をやり直す</button><button class="button ghost" data-action="close">戻る</button></div></div></div>`}return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="操作方法"><h2>🎮 遊び方は3ステップ</h2><ol><li><strong>⚡ 発電所</strong>をタップ（黄色の枠になる）。</li><li><strong>🏠 建物</strong>をタップ。道路に沿って自動配線！</li><li>必須施設をすべて点灯させたら<strong>「復旧完了」</strong>を押して報酬獲得。</li></ol><p>電力が足りなければ別の発電所を選んでね。点灯済みの建物をタップすると、その電線だけ撤去・返金できる。報酬で発電機や電線を強化しよう。</p><div class="actions"><button class="button primary" data-action="close">わかった！</button></div></div></div>`}
function render(){app.innerHTML=head()+(state.screen==='play'?play():state.screen==='result'?result():state.screen==='shop'?shop():ending())+`<div class="footer">夜の復旧班 v0.4｜オフライン試作・セーブなし・追加課金なし</div>`+modal()}
app.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;if(action==='plant')tapPlant(id);else if(action==='building')tapBuilding(id);else if(action==='finish')finish();else if(action==='disconnect')disconnect(id);else if(action==='reset'){state.modal={kind:'reset'};render()}else if(action==='resetConfirm')resetLinks();else if(action==='support')support();else if(action==='next')next();else if(action==='start')startStage();else if(action==='buy')buy(id);else if(action==='restart')restart();else if(action==='help'){state.modal={kind:'help'};render()}else if(action==='close'){state.modal=null;render()}});
render();window.__GAME_TEST__={getState:()=>JSON.parse(JSON.stringify(state)),getLevel:()=>JSON.parse(JSON.stringify(level())),getPath:(a,b)=>pathFind(a,b),getCost:calcCost,autoSolve:()=>{for(const b of level().buildings.filter(b=>b.req&&!state.links[b.id])){let candidates=level().plants.map(p=>({p,path:pathFind(p,b)})).filter(x=>x.path&&capacity(x.p)-used(x.p.id)>=b.load).sort((x,y)=>x.path.length-y.path.length);if(!candidates.length)throw new Error('No capacity for '+b.id+' in '+level().id);const {p,path}=candidates[0];let cost=calcCost(path);if(state.cash<cost&&!state.subsidy)support();if(state.cash<cost)throw new Error('No cash for '+b.id);tapPlant(p.id);tapBuilding(b.id)}finish()}};
})();</script></body></html>
