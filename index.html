<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>夜の復旧班 v0.6</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9f2ff;background:#081321}*{box-sizing:border-box}body{margin:0}header{padding:14px 16px;background:#10243a;border-bottom:1px solid #31516d}h1{font-size:20px;margin:0}small,.muted{color:#9bb3c9}.wrap{max-width:1050px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}.panel{background:#10243a;border:1px solid #2b4c66;border-radius:12px;padding:12px;margin-bottom:12px}h2{font-size:16px;margin:0 0 9px}.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}.stat b{color:#ffe08c}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;touch-action:manipulation}.cell{position:relative;aspect-ratio:1;border:1px solid #304d65;border-radius:6px;background:#193046;color:#cde7f7;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;font-size:21px;cursor:pointer;min-width:0;padding:1px}.cell small{font-size:9px;line-height:1.1;color:#e1edf6;text-align:center}.cell.road{background:#243e50}.cell.power{background:#264e43;border-color:#50bba3}.cell.load{background:#443a2d;border-color:#bca36a}.cell.block{background:#1a2632;color:#566b7c}.cell.wire{box-shadow:inset 0 0 0 3px #d8b951}.cell.strong{box-shadow:inset 0 0 0 3px #54b9ff}.cell.live{background:#245b4c}.cell.pick{outline:3px solid #fff3a1;outline-offset:-3px}.cell.bad{background:#743c3c}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}button{border:1px solid #486b86;background:#203c56;color:#f1f7ff;border-radius:8px;padding:10px 8px;font-weight:650;font-size:13px;cursor:pointer}button.active{background:#197b84;border-color:#6fe5d7}button:disabled{opacity:.38}button.primary{background:#277c5f;border-color:#55b58b}button.warn{background:#754d36}.shop{display:grid;gap:7px}.shop button{text-align:left}.shop span{display:block;font-size:11px;color:#bad1e3;font-weight:400;margin-top:3px}.notice{min-height:48px;padding:10px;background:#162f43;border-radius:8px;font-size:13px;line-height:1.5}.bar{height:8px;border-radius:6px;background:#253e50;overflow:hidden}.bar div{height:100%;background:#5fc7a0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}.tag{background:#244a56;border-radius:5px;padding:3px 6px;font-size:11px}.legend{font-size:12px;color:#b5ccdc;line-height:1.8}.footer{padding:12px;font-size:12px;color:#91a9bb;text-align:center}@media(max-width:760px){.wrap{display:block;padding:8px}.panel{padding:10px;margin-bottom:9px}.cell{font-size:18px;border-radius:4px}.cell small{font-size:8px}.tools{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{gap:9px}header{padding:10px 12px}}
</style></head><body><header><h1>🌃 夜の復旧班 <small>v0.6｜設備経営プロトタイプ</small></h1><div class="stats"><span class="stat">資金 <b id="cash">0</b>円</span><span class="stat">地区 <b id="district">1</b>/8</span><span class="stat">復旧 <b id="served">0</b>/<span id="need">0</span></span><span class="stat">送電量 <b id="used">0</b>/<span id="capacity">0</span></span></div></header><main class="wrap"><section><div class="panel"><div class="row"><h2 id="stageTitle">地区</h2><span class="tag" id="stageTag"></span></div><div id="map" class="grid" aria-label="電力網のマップ"></div><p class="legend">⚡発電所　🏠住宅　🏥病院　🏭工場　🟫障害物　🟨通常電線　🟦高圧電線　🔋蓄電池　🔀分岐器</p><div class="notice" id="message" aria-live="polite"></div></div><div class="panel"><h2>作業ツール（マスをタップして配置）</h2><div class="tools" id="tools"></div><div class="row"><button id="undo">↶ 1手戻す</button><button id="reset" class="warn">地区をやり直す</button><button id="check" class="primary">送電テスト</button></div><small>電線は1マスずつ配置。タップした場所と電力容量が攻略を左右するよ。</small></div></section><aside><div class="panel"><h2>🛒 設備開発・購入</h2><div id="shop" class="shop"></div></div><div class="panel"><h2>📋 仕事の条件</h2><div id="mission"></div><div class="row"><span>復旧率</span><span id="percent">0%</span></div><div class="bar"><div id="progress" style="width:0%"></div></div><p><button class="primary" id="complete" style="width:100%">工事完了・報酬受取</button></p><small>必要な施設すべてに送電すると報酬がもらえる。任意施設の復旧はボーナス。</small></div><div class="panel"><h2>🎯 次に解放されるもの</h2><div id="unlock" class="legend"></div></div></aside></main><div class="footer">オフライン動作 / セーブはこのブラウザ内 / v0.6試作</div><script>
(()=>{'use strict';const W=8,H=7,el=id=>document.getElementById(id),K=(x,y)=>x+','+y,parse=k=>k.split(',').map(Number),dirs=[[1,0],[-1,0],[0,1],[0,-1]],neighbors=k=>{let [x,y]=parse(k);return dirs.map(([dx,dy])=>K(x+dx,y+dy)).filter(a=>{let [u,v]=parse(a);return u>=0&&u<W&&v>=0&&v<H})};
const stages=[
{name:'住宅街の灯り',demand:[{x:5,y:1,p:2,e:'🏠',n:'住宅'},{x:6,y:5,p:2,e:'🏠',n:'住宅'}],blocks:[[3,3],[3,4]],source:[0,3],power:6,reward:450,bonus:100,brief:'電線を1マスずつ敷き、住宅2軒を復旧。まずは工具に慣れよう。'},
{name:'診療所への道',demand:[{x:6,y:1,p:4,e:'🏥',n:'診療所'},{x:6,y:5,p:2,e:'🏠',n:'住宅'}],blocks:[[2,2],[3,2],[4,2],[2,4],[3,4],[4,4]],source:[0,3],power:7,reward:600,bonus:150,brief:'回り道が必要。電線を節約すると次の設備を早く買える。'},
{name:'工業団地',demand:[{x:6,y:1,p:5,e:'🏭',n:'工場'},{x:5,y:5,p:3,e:'🏠',n:'住宅'}],blocks:[[3,1],[3,2],[3,3],[3,4],[3,5]],source:[0,3],power:7,reward:850,bonus:200,brief:'必要電力8。発電能力の増強が必要。'},
{name:'分岐の街',demand:[{x:6,y:1,p:4,e:'🏥',n:'病院'},{x:6,y:5,p:4,e:'🏭',n:'工場'},{x:4,y:3,p:2,e:'🏠',n:'住宅'}],blocks:[[2,1],[2,5],[5,2],[5,4]],source:[0,3],power:8,reward:1100,bonus:250,brief:'施設が3つ。分岐器があれば、複数ルートに送電できる。'},
{name:'山越えの送電',demand:[{x:7,y:0,p:5,e:'🏭',n:'工場'},{x:7,y:6,p:5,e:'🏥',n:'病院'}],blocks:[[2,1],[2,2],[2,3],[2,4],[2,5],[4,1],[4,2],[4,4],[4,5]],source:[0,3],power:9,reward:1400,bonus:300,brief:'遠い施設へ大量送電。高圧電線を使うと通せる電力が増える。'},
{name:'停電の夜',demand:[{x:6,y:1,p:6,e:'🏥',n:'救急病院'},{x:6,y:5,p:5,e:'🏭',n:'工場'},{x:3,y:0,p:2,e:'🏠',n:'住宅'}],blocks:[[2,2],[3,2],[4,2],[2,4],[3,4],[4,4]],source:[0,3],power:10,reward:1800,bonus:400,brief:'蓄電池が活躍。設備への投資が復旧のカギ。'},
{name:'都市中枢',demand:[{x:7,y:0,p:6,e:'🏥',n:'病院'},{x:7,y:6,p:6,e:'🏭',n:'工場'},{x:4,y:3,p:4,e:'🏠',n:'住宅'}],blocks:[[2,1],[2,5],[5,1],[5,5]],source:[0,3],power:12,reward:2300,bonus:500,brief:'発電・送電容量を整え、全施設へ電力を届けよう。'},
{name:'最後の大停電',demand:[{x:7,y:0,p:7,e:'🏥',n:'総合病院'},{x:7,y:6,p:7,e:'🏭',n:'工場'},{x:4,y:0,p:3,e:'🏠',n:'住宅'},{x:4,y:6,p:3,e:'🏠',n:'住宅'}],blocks:[[2,2],[2,4],[5,2],[5,4]],source:[0,3],power:14,reward:3500,bonus:900,brief:'これまでの設備と投資を活用して街の全電力を復旧しよう。'}];
const types={wire:{label:'🟨 電線',cost:12,desc:'1マス。送電容量6'},heavy:{label:'🟦 高圧電線',cost:35,desc:'1マス。送電容量20'},split:{label:'🔀 分岐器',cost:95,desc:'3方向以上の接続に必要'},battery:{label:'🔋 蓄電池',cost:180,desc:'設置すると供給電力+4'},erase:{label:'✂️ 撤去',cost:0,desc:'配置した設備を撤去（半額返金）'}};
let state={stage:0,cash:500,gen:0,wireTech:false,splitTech:false,batteryTech:false,discount:0,placed:{},tool:'wire',history:[],won:false};let msg='電線を選び、発電所から施設までマスをタップしてつなごう。';
try{let s=JSON.parse(localStorage.getItem('night_restore_v06'));if(s&&Number.isInteger(s.stage)&&s.stage>=0&&s.stage<=8)state={...state,...s,history:[],won:false}}catch(e){}
function stage(){return stages[Math.min(state.stage,7)]}function source(){return K(...stage().source)}function blocks(){return new Set(stage().blocks.map(p=>K(...p)))}function loads(){return new Map(stage().demand.map(d=>[K(d.x,d.y),d]))}function price(t){return t==='wire'?Math.max(4,12-state.discount*3):types[t].cost}function allowed(t){return t==='wire'||t==='erase'||t==='heavy'&&state.wireTech||t==='split'&&state.splitTech||t==='battery'&&state.batteryTech}
function save(){let {history,...s}=state;try{localStorage.setItem('night_restore_v06',JSON.stringify(s))}catch(e){}}
function capacity(){return stage().power+state.gen*4+Object.values(state.placed).filter(v=>v==='battery').length*4}
function evaluate(){let connected=new Set([source()]),queue=[source()],map=loads(),all=new Set([...Object.keys(state.placed),...map.keys(),source()]);while(queue.length){let k=queue.shift();for(let n of neighbors(k))if(all.has(n)&&!connected.has(n)){connected.add(n);queue.push(n)}}let active=[...map.entries()].filter(([k])=>connected.has(k));let load=active.reduce((a,[,d])=>a+d.p,0);let faults=[];for(let k of connected){let t=state.placed[k];if(!t||t==='battery')continue;let degree=neighbors(k).filter(n=>connected.has(n)).length;if(degree>=3&&t!=='split')faults.push('分岐器が必要（'+k+'）');if(t==='wire'&&load>6)faults.push('通常電線の容量不足（'+k+'）')}return{connected,active,load,faults,complete:active.length===map.size&&load<=capacity()&&faults.length===0}}
function snapshot(){state.history.push({placed:{...state.placed},cash:state.cash});if(state.history.length>50)state.history.shift()}
function tap(k){if(state.stage>=8)return;let map=loads(),b=blocks();if(k===source()||map.has(k)||b.has(k)){msg='ここには設備を置けないよ。空いているマスを選ぼう。';render();return}let old=state.placed[k],t=state.tool;if(t==='erase'){if(!old){msg='撤去する設備がないよ。';render();return}snapshot();state.cash+=Math.floor(price(old)/2);delete state.placed[k];msg='設備を1つ撤去。半額を返金したよ。'}else{if(!allowed(t))return;if(old){msg='既に設備があるよ。撤去してから交換しよう。';render();return}let c=price(t);if(state.cash<c){msg='資金不足！仕事を完了して報酬を得よう。';render();return}snapshot();state.cash-=c;state.placed[k]=t;msg=types[t].label+'を設置（-'+c+'円）。'}state.won=false;save();render()}
function buy(what){let opts={gen:{cost:350+state.gen*300,label:'発電機を強化',ok:state.gen<4},heavy:{cost:500,label:'高圧電線を解放',ok:!state.wireTech},split:{cost:650,label:'分岐器を解放',ok:!state.splitTech},battery:{cost:850,label:'蓄電池を解放',ok:!state.batteryTech},discount:{cost:450+state.discount*300,label:'施工効率を強化',ok:state.discount<3}};let v=opts[what];if(!v.ok||state.cash<v.cost){msg='資金が足りないか、すでに最大強化だよ。';render();return}state.cash-=v.cost;if(what==='gen')state.gen++;if(what==='heavy')state.wireTech=true;if(what==='split')state.splitTech=true;if(what==='battery')state.batteryTech=true;if(what==='discount')state.discount++;msg=v.label+'を購入！新しい作業ができるようになった。';save();render()}
function render(){let s=stage(),map=loads(),b=blocks(),e=evaluate();el('cash').textContent=state.cash.toLocaleString();el('district').textContent=Math.min(8,state.stage+1);el('served').textContent=e.active.length;el('need').textContent=map.size;el('used').textContent=e.load;el('capacity').textContent=capacity();el('stageTitle').textContent=state.stage>=8?'🎉 全地区復旧！':s.name;el('stageTag').textContent=state.stage>=8?'クリア':'第'+(state.stage+1)+'地区';el('map').innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let k=K(x,y),t=state.placed[k],d=map.get(k),src=k===source(),block=b.has(k),live=e.connected.has(k),c=document.createElement('button');c.className='cell '+(block?'block':src?'power':d?'load':'road')+(t?' '+(t==='heavy'?'strong':'wire'):'')+(live&&(d||t)?' live':'');let glyph=src?'⚡':d?d.e:block?'▦':t==='wire'?'━':t==='heavy'?'═':t==='split'?'🔀':t==='battery'?'🔋':'·';c.innerHTML='<span>'+glyph+'</span>'+(d?'<small>'+d.p+'電力</small>':src?'<small>電源</small>':t?'<small>'+({wire:'電線',heavy:'高圧',split:'分岐',battery:'蓄電'}[t])+'</small>':'');c.title=d?d.n+' 必要電力'+d.p:k;c.onclick=()=>tap(k);el('map').append(c)}el('tools').innerHTML='';for(let [k,t] of Object.entries(types)){let btn=document.createElement('button');btn.className=state.tool===k?'active':'';btn.disabled=!allowed(k)||state.stage>=8;btn.innerHTML=t.label+'<br><small>'+(k==='erase'?'半額返金':price(k)+'円')+'</small>';btn.onclick=()=>{state.tool=k;msg=t.desc;render()};el('tools').append(btn)}let shop=[['gen','⚡ 発電機強化','供給電力+4',350+state.gen*300,state.gen<4],['heavy','🟦 高圧電線 解放','送電容量20の電線',500,!state.wireTech],['split','🔀 分岐器 解放','3方向以上に配線',650,!state.splitTech],['battery','🔋 蓄電池 解放','マップに置いて供給+4',850,!state.batteryTech],['discount','🛠️ 施工効率強化','電線1マスの価格−3円',450+state.discount*300,state.discount<3]];el('shop').innerHTML='';for(let [k,label,desc,c,ok]of shop){let btn=document.createElement('button');btn.disabled=!ok||state.cash<c||state.stage>=8;btn.innerHTML='<b>'+label+'</b>　'+(ok?c+'円':'購入済/最大')+'<span>'+desc+'</span>';btn.onclick=()=>buy(k);el('shop').append(btn)}let pct=Math.round(e.active.length/map.size*100);el('percent').textContent=pct+'%';el('progress').style.width=pct+'%';el('mission').innerHTML='<p>'+s.brief+'</p><p>基本報酬 <b>'+s.reward+'円</b> / 省資材ボーナス 最大'+s.bonus+'円</p><p class="muted">必要電力 '+[...map.values()].reduce((a,d)=>a+d.p,0)+' / 発電能力 '+capacity()+'</p>';el('complete').disabled=!e.complete||state.stage>=8;el('message').textContent=msg+(e.faults.length?' ⚠ '+[...new Set(e.faults)].slice(0,2).join('、'):'')+(e.load>capacity()?' ⚠ 発電能力不足':'');el('unlock').innerHTML='発電機の強化で送電できる建物が増える。<br>高圧電線で大電力を通せる。<br>分岐器で3方向以上に接続。<br>蓄電池で発電量を補える。<br><br>※ 今回は購入順を自分で決められる。';save()}
el('undo').onclick=()=>{let a=state.history.pop();if(a){state.placed=a.placed;state.cash=a.cash;msg='1手戻したよ。';render()}};el('reset').onclick=()=>{if(confirm('この地区の配線を全撤去する？ 設置費用は全額戻るよ。')){state.cash+=Object.values(state.placed).reduce((a,t)=>a+price(t),0);state.placed={};state.history=[];msg='配線を撤去して再スタート。';render()}};el('check').onclick=()=>{let e=evaluate();msg=e.complete?'送電成功！「工事完了」で報酬を受け取ろう。':e.faults.length?'送電失敗：'+[...new Set(e.faults)].slice(0,3).join(' / '):e.load>capacity()?'発電能力が足りない！':'未接続の施設があるよ。電線の接続を確認しよう。';render()};el('complete').onclick=()=>{let e=evaluate();if(!e.complete)return;let s=stage(),cost=Object.values(state.placed).reduce((a,t)=>a+price(t),0),bonus=Math.max(0,s.bonus-Math.floor(cost/10));state.cash+=s.reward+bonus;state.stage++;state.placed={};state.history=[];state.tool='wire';msg=state.stage>=8?'🎉 全8地区を復旧！街に明かりが戻った！':'地区クリア！ '+(s.reward+bonus)+'円獲得。次の地区が解放された！';save();render()};render();})();
</script></body></html>
