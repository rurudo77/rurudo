<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>夜の復旧班 v0.7</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#091424;color:#eaf5ff;font-family:system-ui,-apple-system,sans-serif}header{padding:13px 16px;background:#101f32;display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:17px;margin:0}small{color:#a5c1d4}.layout{display:grid;grid-template-columns:minmax(0,1fr) 295px;max-width:1280px;margin:auto;gap:12px;padding:12px}.panel{background:#12253a;border:1px solid #29435b;border-radius:13px;padding:12px}.mapwrap{position:relative;overflow:hidden;background:linear-gradient(#1b3554,#091626);border-radius:12px;touch-action:manipulation}canvas{display:block;width:100%;height:auto;touch-action:manipulation}button{cursor:pointer;border:1px solid #52708b;border-radius:9px;background:#233d56;color:white;padding:10px;font-weight:700;font-size:13px}button.active{background:#1d796e;border-color:#7be0b3}button:disabled{opacity:.4}button:active{transform:scale(.98)}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:#0c1b2b;border-radius:9px;padding:9px;font-size:12px}.stat b{font-size:19px;color:#a4e8b5}.section{margin:13px 0 7px;font-size:14px;font-weight:800}.hint{color:#b8d0df;font-size:12px;line-height:1.7}.toast{background:#183a4d;border-left:3px solid #74dfbe;padding:10px;margin-top:9px;border-radius:7px;min-height:54px;font-size:13px;line-height:1.5}.progress{height:9px;background:#263d4c;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#68d5a4;transition:width .2s}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.toolbar button{flex:1}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#c4d8e4;margin-top:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px}.overlay{position:absolute;inset:0;background:#061421e8;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay.show{display:flex}.overlay .panel{max-width:390px}#mission{font-size:13px;line-height:1.7;color:#d3e8f4}#info{font-size:12px;line-height:1.6;color:#b6d1e4}footer{text-align:center;color:#7b9eb4;font-size:11px;padding:12px}@media(max-width:750px){.layout{display:block;padding:7px}.side{margin-top:9px}header{padding:10px}h1{font-size:15px}.panel{padding:10px}.tools{grid-template-columns:1fr 1fr}.stat b{font-size:17px}}
</style></head><body><header><div><h1>⚡ 夜の復旧班 <small>v0.7 立体街づくり試作</small></h1><small>設備を建てて、停電した街に明かりを戻そう</small></div><button id="help">遊び方</button></header><main class="layout"><section class="panel"><div class="mapwrap"><canvas id="game" width="850" height="630"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="overTitle">街が復旧した！</h2><p id="overText"></p><button id="overClose">続けて遊ぶ</button></div></div></div><div class="legend"><span><i class="dot" style="background:#ffcf75"></i>点灯した建物</span><span><i class="dot" style="background:#526879"></i>停電中</span><span><i class="dot" style="background:#65d4f3"></i>電力設備</span></div><div class="toolbar"><button id="rotate">🔄 視点回転</button><button id="undo">↩ 1手戻す</button><button id="reset">最初から</button></div></section><aside class="panel side"><div class="stats"><div class="stat">資金<br><b id="money">0</b> <small>G</small></div><div class="stat">毎秒収益<br><b id="income">0</b> <small>G</small></div><div class="stat">復旧した建物<br><b id="lit">0/0</b></div><div class="stat">供給電力<br><b id="power">0/0</b></div></div><div class="section">建設・撤去</div><div class="tools" id="tools"></div><div class="section">研究・解放</div><div class="tools" id="research"></div><div class="section">街の目標</div><div id="mission"></div><div class="progress"><div id="bar"></div></div><div class="section">操作ガイド</div><div id="info">設備を選んで、街の空き地をタップ。</div><div class="toast" id="toast">最初は電柱を住宅の近くに建てよう！</div></aside></main><footer>オフライン動作 / セーブはこの端末のブラウザ内 / 立体表示はCanvasによる疑似3D</footer><script>
(()=>{'use strict';const W=9,H=9,canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);const defs={pole:{name:'電柱',price:60,range:2,icon:'⚡',desc:'周囲2マスに送電。発電所や他の電柱から3マス以内で接続'},sub:{name:'変電所',price:230,range:3,icon:'🔷',desc:'周囲3マスに送電。電柱より広い。研究で解放'},plant:{name:'発電機',price:390,range:2,icon:'🏭',desc:'電力供給を+6。研究で解放'},battery:{name:'蓄電池',price:320,range:2,icon:'🔋',desc:'供給を+3。研究で解放'}};const buildings=[{x:2,y:1,t:'house',n:'北の住宅',d:1,rev:3},{x:4,y:1,t:'house',n:'住宅A',d:1,rev:3},{x:6,y:1,t:'shop',n:'商店',d:2,rev:6},{x:1,y:3,t:'house',n:'住宅B',d:1,rev:3},{x:4,y:3,t:'house',n:'住宅C',d:1,rev:3},{x:7,y:3,t:'shop',n:'市場',d:2,rev:6},{x:2,y:5,t:'house',n:'住宅D',d:1,rev:3},{x:5,y:5,t:'factory',n:'小工場',d:3,rev:10},{x:7,y:6,t:'house',n:'住宅E',d:1,rev:3},{x:1,y:7,t:'shop',n:'南の商店',d:2,rev:6},{x:4,y:7,t:'factory',n:'工場',d:4,rev:13}];const base={x:0,y:0,t:'base'};const key=(x,y)=>x+','+y;const occupied=new Set(buildings.map(b=>key(b.x,b.y)).concat([key(0,0)]));const initial=()=>({money:250,owned:[],unlocked:{sub:false,plant:false,battery:false},selected:'pole',angle:0,earned:0,finished:false});let s;try{s=JSON.parse(localStorage.getItem('night_restore_v07'))||initial();if(!s.unlocked||!Array.isArray(s.owned))s=initial()}catch{s=initial()}let history=[],lastIncome=0,litCount=0,supply=0,used=0,drawList=[];const save=()=>{try{localStorage.setItem('night_restore_v07',JSON.stringify(s))}catch{}};const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);const isNear=(a,b,r)=>dist(a,b)<=r;function evaluate(){const nodes=[base,...s.owned],connected=new Set([key(0,0)]);let changed=true;while(changed){changed=false;for(const n of s.owned){const k=key(n.x,n.y);if(connected.has(k))continue;if(nodes.some(q=>connected.has(key(q.x,q.y))&&isNear(n,q,3))){connected.add(k);changed=true}}}const emit=nodes.filter(n=>connected.has(key(n.x,n.y)));supply=6+s.owned.filter(n=>n.t==='plant'&&connected.has(key(n.x,n.y))).length*6+s.owned.filter(n=>n.t==='battery'&&connected.has(key(n.x,n.y))).length*3;const candidates=buildings.map(b=>({...b,reachable:emit.some(n=>isNear(n,b,n.t==='sub'?3:2))})).filter(b=>b.reachable).sort((a,b)=>a.d-b.d||a.y-b.y||a.x-b.x);let rem=supply,lit=new Set;for(const b of candidates){if(rem>=b.d){rem-=b.d;lit.add(key(b.x,b.y))}}used=supply-rem;litCount=lit.size;lastIncome=buildings.filter(b=>lit.has(key(b.x,b.y))).reduce((a,b)=>a+b.rev,0);return{connected,lit,emit}}function say(t){$('toast').textContent=t}function push(){history.push(JSON.stringify(s));if(history.length>40)history.shift()}function doBuild(x,y){const k=key(x,y);if(s.selected==='remove'){const idx=s.owned.findIndex(n=>key(n.x,n.y)===k);if(idx<0){say('撤去できる設備をタップしてね');return}push();const n=s.owned.splice(idx,1)[0];s.money+=Math.floor(defs[n.t].price*.8);say(defs[n.t].name+'を撤去。80%の資金を回収したよ');update();return}const d=defs[s.selected];if(!d)return;if(occupied.has(k)||s.owned.some(n=>key(n.x,n.y)===k)){say('ここには建設できないよ。空き地を選んでね');return}if(s.money<d.price){say('資金不足！ 収入は毎秒増えるよ。既存の設備は80%で売却可能');return}if(![base,...s.owned].some(n=>isNear({x,y},n,3))){say('既存の設備から3マス以内に建ててね（送電網と接続するため）');return}push();s.money-=d.price;s.owned.push({x,y,t:s.selected});say(d.name+'を建設！ 住宅に明かりがつくか確認しよう');update()}const iso=(x,y)=>{let a=x,b=y;switch(s.angle%4){case 1:a=H-1-y;b=x;break;case 2:a=W-1-x;b=H-1-y;break;case 3:a=y;b=W-1-x}return{x:425+(a-b)*39,y:115+(a+b)*23}};function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function block(cx,cy,w,h,z,top,left,right){poly([[cx,cy-z],[cx+w,cy+h-z],[cx,cy+2*h-z],[cx-w,cy+h-z]],top);poly([[cx-w,cy+h-z],[cx,cy+2*h-z],[cx,cy+2*h]],left);poly([[cx,cy+2*h-z],[cx+w,cy+h-z],[cx+w,cy+h],[cx,cy+2*h]],right)}function draw(){const {connected,lit,emit}=evaluate();ctx.clearRect(0,0,850,630);const bg=ctx.createLinearGradient(0,0,0,630);bg.addColorStop(0,'#254766');bg.addColorStop(1,'#071322');ctx.fillStyle=bg;ctx.fillRect(0,0,850,630);ctx.fillStyle='#bfd7e5';ctx.font='bold 14px system-ui';ctx.fillText('停電した街を復旧しよう',18,26);drawList=[];for(let x=0;x<W;x++)for(let y=0;y<H;y++){const p=iso(x,y);drawList.push({x,y,px:p.x,py:p.y,depth:p.y})}drawList.sort((a,b)=>a.depth-b.depth);for(const p of drawList){const {x,y,px,py}=p,k=key(x,y);poly([[px,py],[px+37,py+22],[px,py+44],[px-37,py+22]],(x+y)%2?'#284d47':'#2e5b50','#355d57');if((x===0||y===0||x===4||y===4)){poly([[px,py+4],[px+30,py+22],[px,py+40],[px-30,py+22]],'#394b57')}const b=buildings.find(q=>q.x===x&&q.y===y),n=s.owned.find(q=>q.x===x&&q.y===y),isBase=x===0&&y===0;if(b){const on=lit.has(k),height=b.t==='factory'?49:b.t==='shop'?33:26;block(px,py+12,20,11,height,on?'#f5c97e':'#667c8b',on?'#bf8c4c':'#364a5c',on?'#d9a85b':'#4d6071');ctx.fillStyle=on?'#ffe2a3':'#182e40';for(let j=0;j<2;j++)ctx.fillRect(px-13+j*13,py+13-height+13,7,7);ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillStyle=on?'#ffe6ac':'#bbcad6';ctx.fillText(b.t==='factory'?'🏭':b.t==='shop'?'🏪':'🏠',px,py+7-height);ctx.textAlign='start'}else if(isBase||n){const active=isBase||connected.has(k);block(px,py+13,18,9,isBase?48:n.t==='pole'?25:n.t==='sub'?35:43,active?'#67d8e7':'#627482',active?'#27748a':'#384f5d',active?'#368ba2':'#536778');ctx.textAlign='center';ctx.font='21px system-ui';ctx.fillText(isBase?'⚡':defs[n.t].icon,px,py-23);ctx.textAlign='start';if(active){ctx.strokeStyle='#76e7ff99';ctx.lineWidth=2;for(const q of emit){if(q===n||q===base)continue;if(dist(q,n||base)<=3){const t=iso(q.x,q.y);ctx.beginPath();ctx.moveTo(px,py+5);ctx.lineTo(t.x,t.y+5);ctx.stroke();break}}}}else if(!occupied.has(k)){ctx.fillStyle='#9eb9ad55';ctx.beginPath();ctx.arc(px,py+19,2.5,0,Math.PI*2);ctx.fill()}}ctx.fillStyle='#e5f4ff';ctx.font='12px system-ui';ctx.fillText('タップで設備を建設 / 撤去',18,606)}function renderButtons(){const list=$('tools');list.innerHTML='';for(const [id,d] of Object.entries(defs)){if(id!=='pole'&&!s.unlocked[id])continue;const b=document.createElement('button');b.className=s.selected===id?'active':'';b.textContent=d.icon+' '+d.name+' '+d.price+'G';b.title=d.desc;b.onclick=()=>{s.selected=id;say(d.desc);update()};list.appendChild(b)}const rm=document.createElement('button');rm.className=s.selected==='remove'?'active':'';rm.textContent='🧹 撤去（80%返金）';rm.onclick=()=>{s.selected='remove';say('撤去したい設備をタップ。購入額の80%が戻るよ');update()};list.appendChild(rm);const r=$('research');r.innerHTML='';for(const [id,cost,require,desc] of [['sub',280,2,'変電所：送電範囲が3マスに広がる'],['plant',430,4,'発電機：供給電力+6'],['battery',350,6,'蓄電池：供給電力+3']]){const b=document.createElement('button');b.textContent=s.unlocked[id]?'✓ '+defs[id].name+'解放済':defs[id].icon+' '+defs[id].name+'研究 '+cost+'G';b.disabled=s.unlocked[id]||litCount<require;b.onclick=()=>{if(s.money<cost){say('研究資金が足りないよ。建物の収益を貯めよう');return}push();s.money-=cost;s.unlocked[id]=true;s.selected=id;say('新設備解放！ '+desc);update()};r.appendChild(b)}}function update(){const old=litCount;const ev=evaluate();$('money').textContent=Math.floor(s.money);$('income').textContent=lastIncome;$('lit').textContent=litCount+'/'+buildings.length;$('power').textContent=used+'/'+supply;$('bar').style.width=(litCount/buildings.length*100)+'%';let next=litCount<2?'住宅2軒を復旧すると「変電所」の研究が解放':litCount<4?'4軒復旧すると「発電機」の研究が解放':litCount<6?'6軒復旧すると「蓄電池」の研究が解放':litCount<buildings.length?'全11棟に送電して街を完全復旧しよう':'全11棟復旧！街が明るくなった！';$('mission').innerHTML='<b>'+next+'</b><br>収益で研究し、建設可能な設備を増やそう。<br>電力不足なら発電機、届かない場所は電柱・変電所。';$('info').textContent=s.selected==='remove'?'設備をタップして撤去（80%返金）':defs[s.selected]?defs[s.selected].desc:'設備を選んで配置';renderButtons();draw();save();if(litCount===buildings.length&&!s.finished){s.finished=true;save();$('overTitle').textContent='🎉 街の明かりが戻った！';$('overText').textContent='11棟すべて復旧！ 設備を配置し直したり、別の経営方針でも挑戦できるよ。';$('overlay').classList.add('show')}}function clickMap(e){const rect=canvas.getBoundingClientRect();const px=(e.clientX-rect.left)*850/rect.width,py=(e.clientY-rect.top)*630/rect.height;let best=null,score=999;for(const p of drawList){const dx=Math.abs(px-p.px)/38,dy=Math.abs(py-(p.py+21))/23;const d=dx+dy;if(d<score){score=d;best=p}}if(best&&score<1.25)doBuild(best.x,best.y);else say('街のマス目をタップしてね')}canvas.addEventListener('click',clickMap);$('rotate').onclick=()=>{s.angle=(s.angle+1)%4;update()};$('undo').onclick=()=>{if(!history.length){say('戻せる操作がないよ');return}s=JSON.parse(history.pop());say('1手戻したよ');update()};$('reset').onclick=()=>{if(confirm('ゲームを最初からやり直す？ セーブも消えるよ')){s=initial();history=[];say('新しい街で再スタート！');update()}};$('help').onclick=()=>{alert('【遊び方】\n① 電柱を選んで空き地に建てる\n② 電柱の周囲2マスに住宅があると点灯\n③ 点灯した建物から毎秒収益が入る\n④ 復旧した建物数で新設備の研究が解放\n⑤ 研究費を払って新設備を使おう\n⑥ 供給電力が足りない時は発電機を建てる\n\n設備は発電所・既存設備から3マス以内に建設。撤去は80%返金。資金が足りなくても収益が続くので詰みにくい設計です。')};$('overClose').onclick=()=>{$('overlay').classList.remove('show')};setInterval(()=>{evaluate();if(lastIncome){s.money+=lastIncome/2;s.earned+=lastIncome/2;update()}},500);update()})();
</script></body></html>
